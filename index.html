<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locktober – Partner</title>
<style>
:root{--bg:#12141a;--card:#1c1f28;--tx:#eef0f5;--mu:#8d95a5;--ac:#e0a43a;--bad:#e5707a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:16px}h1{text-align:center}
.c{background:var(--card);border-radius:14px;padding:16px;margin:14px 0}
.mu{color:var(--mu);font-size:.9rem}.big{font-size:2rem;font-weight:700;text-align:center;margin:8px 0}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px}
button.s{background:#2c3140;color:var(--tx);width:auto;padding:8px 12px;margin:0}
textarea,input{width:100%;background:#12141a;color:var(--tx);border:1px solid #333a4a;border-radius:8px;padding:10px;font:inherit}
textarea{min-height:80px}.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #2a2f3c}
.row>div{flex:1}.gone{opacity:.45;text-decoration:line-through}.two{display:flex;gap:8px}
</style></head><body><main>
<h1>🔑 Locktober – Partner</h1><div id="app"></div></main>
<script>
// ====== FILL THESE TWO IN (from Supabase > Project Settings > API) ======
const SUPA_URL = "https://jezatosulylspmxwkird.supabase.co";
const SUPA_KEY = "sb_publishable_6MxNbp6uItR2beZiTbtvrA_37r_4Xjj";
// ========================================================================
const $=i=>document.getElementById(i),RSA={name:"RSA-OAEP",hash:"SHA-256"};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const H={apikey:SUPA_KEY,"Content-Type":"application/json"};if(SUPA_KEY.startsWith("eyJ"))H.Authorization="Bearer "+SUPA_KEY;
const rest=(p,o={})=>fetch(SUPA_URL+"/rest/v1/"+p,{...o,headers:{...H,...(o.headers||{})}});
const rpc=(n,a)=>rest("rpc/"+n,{method:"POST",body:JSON.stringify(a)});
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const pubOf=p=>({kty:"RSA",n:p.n,e:p.e,alg:"RSA-OAEP-256",ext:true,key_ops:["encrypt"]});
let S=JSON.parse(localStorage.lt2||"null"),priv=null,msg="",upd="",bad=new Set();
const save=()=>localStorage.lt2=JSON.stringify(S);
const fmt=s=>`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`;
const esc=t=>String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const total=()=>Math.max(0,Object.values(S.ev).filter(e=>!S.rm.includes(e.id)).reduce((a,e)=>a+e.s,0)-S.sub.reduce((a,x)=>a+x.s,0));
const keyText=()=>"LT2:"+btoa(JSON.stringify({r:S.room,p:S.priv}));
async function seal(o){
 const pub=await crypto.subtle.importKey("jwk",pubOf(S.priv),RSA,false,["encrypt"]);
 const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,new TextEncoder().encode(JSON.stringify(o)));
 return{k:b64(await crypto.subtle.encrypt({name:"RSA-OAEP"},pub,await crypto.subtle.exportKey("raw",aes))),i:b64(iv),d:b64(d)};}
async function open(c){
 priv=priv||await crypto.subtle.importKey("jwk",S.priv,RSA,false,["decrypt"]);
 const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,un(c.k));
 const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un(c.i)},key,un(c.d))));}
async function setup(){
 const room=location.hash.slice(1);msg="";
 const k=await crypto.subtle.generateKey({...RSA,name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,["encrypt","decrypt"]);
 const p=await crypto.subtle.exportKey("jwk",k.privateKey);
 const r=await rpc("claim_room",{p_room:room,p_token:await sha(p.d),p_pub:JSON.stringify(pubOf(p))});
 if(!r.ok){msg="This link was already used. If that was you, restore with your saved key below.";return render()}
 S={room,priv:p,ev:{},rm:[],sub:[],saved:false};save();render();}
async function restore(){
 try{const k=JSON.parse(atob($("rk").value.trim().replace(/^LT2:/,"")));
  S={room:k.r,priv:k.p,ev:{},rm:[],sub:[],saved:true};priv=null;
  const j=(await(await rest(`rooms?room=eq.${S.room}&select=state`)).json())[0];
  if(j&&j.state){const st=await open(JSON.parse(j.state));S.rm=st.rm;S.sub=st.sub}
  save();msg="";await pull(true);
 }catch{S=null;msg="That key didn't work.";render()}}
async function pull(force){
 if(!S)return;
 try{const rows=await(await rest(`entries?room=eq.${S.room}&select=id,blob&order=created_at`)).json();let n=0;
  for(const e of rows)if(!S.ev[e.id]&&!bad.has(e.id)){try{S.ev[e.id]=await open(e.blob);n++}catch{bad.add(e.id)}}
  upd="Updated "+new Date().toLocaleTimeString();if(n){save()}if(n||force||!$("pl"))render();else $("pl").textContent=upd;
 }catch{upd="Offline – will retry";if($("pl"))$("pl").textContent=upd}}
async function push(){rpc("save_room",{p_room:S.room,p_token:await sha(S.priv.d),p_state:JSON.stringify(await seal({rm:S.rm,sub:S.sub})),p_final:null})}
function sub(){const s=(+$("h").value||0)*3600+(+$("m").value||0)*60;if(s>0){S.sub.push({s});save();push();render()}}
function tog(id){S.rm=S.rm.includes(id)?S.rm.filter(x=>x!==id):[...S.rm,id];save();push();render()}
async function fin(){if(confirm("This shows them the final total. Continue?")){
 const r=await rpc("save_room",{p_room:S.room,p_token:await sha(S.priv.d),p_state:null,p_final:total()});alert(r.ok?"Done – their tracker will show the total.":"Something went wrong.")}}
function render(){
 const A=$("app");
 if(!S){const has=!!location.hash.slice(1);A.innerHTML=`<div class="c">${has?`<p>Welcome! Tap the button once to get set up.</p><button onclick="setup()">GET STARTED</button>`:`<p>Open the link your partner sent you (it ends with # and a code).</p>`}
  ${msg?`<p class="mu" style="color:var(--bad)">${msg}</p>`:""}</div>
  <details class="c"><summary>Restore with saved key</summary><textarea id="rk" placeholder="LT2:..."></textarea><button onclick="restore()">RESTORE</button></details>`;return}
 if(!S.saved){A.innerHTML=`<div class="c"><b>Save this key – important!</b><p class="mu">It's the only thing that can unlock the data if this browser is ever cleared. Copy it into your notes app (or email it to yourself).</p>
  <textarea readonly onclick="this.select()">${keyText()}</textarea><button onclick="navigator.clipboard.writeText(keyText());this.textContent='Copied ✓'">COPY KEY</button>
  <button onclick="S.saved=true;save();render()" style="background:#2c3140;color:var(--tx)">I SAVED IT – CONTINUE</button></div>`;return}
 const ents=Object.values(S.ev).sort((a,b)=>b.a<a.a?-1:1);
 A.innerHTML=`
 <div class="c"><div class="mu" style="text-align:center">Total outside time</div><div class="big">${fmt(total())}</div>
 <div class="mu" style="text-align:center">${ents.length} entries · <span id="pl">${upd}</span></div><button class="s" style="width:100%;margin-top:8px" onclick="pull(true)">Refresh now</button></div>
 <div class="c"><b>Take time off</b><div class="two" style="margin-top:8px"><input id="h" type="number" min="0" placeholder="hours"><input id="m" type="number" min="0" placeholder="minutes"></div>
 <button onclick="sub()">REMOVE THIS MUCH</button>
 ${S.sub.map((x,i)=>`<div class="row"><div>−${fmt(x.s)}</div><button class="s" onclick="S.sub.splice(${i},1);save();push();render()">Undo</button></div>`).join("")}
 <p class="mu">They can't see any of this. New entries keep arriving by themselves.</p></div>
 <div class="c"><b>Entries</b>${ents.map(e=>`<div class="row ${S.rm.includes(e.id)?"gone":""}"><div>${fmt(e.s)}<div class="mu">${new Date(e.a).toLocaleString()}${e.n?" · "+esc(e.n):""}</div></div>
 <button class="s" onclick="tog('${e.id}')">${S.rm.includes(e.id)?"Restore":"Remove"}</button></div>`).join("")||'<p class="mu">Nothing yet.</p>'}</div>
 <div class="c"><b>Reveal</b><p class="mu">When October is over, tap this to show them the final total.</p><button onclick="fin()">REVEAL TOTAL TO THEM</button></div>
 <details class="c"><summary>My saved key</summary><textarea readonly onclick="this.select()">${keyText()}</textarea></details>`}
if(SUPA_URL.startsWith("PASTE"))document.getElementById("app").innerHTML='<div class="c">Setup missing: fill in SUPA_URL and SUPA_KEY at the top of this file.</div>';
else{render();if(S){pull(true);setInterval(()=>{if(!document.hidden)pull()},20000)}}
</script></body></html>
